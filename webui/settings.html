<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - OptimaBay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <span class="brand">OptimaBay</span>
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Experiments</a>
        <a href="settings.html" class="active-tab">Settings</a>
    </nav>
    <main>
        <h2 class="section-title">Settings</h2>
        <div class="settings-panel">
            <div class="form-group">
                <label for="defaultDirection">Default Objective Direction</label>
                <select id="defaultDirection">
                    <option value="minimize">Minimize</option>
                    <option value="maximize">Maximize</option>
                </select>
            </div>
            <div class="form-group">
                <label for="defaultSurrogate">Default Surrogate Model</label>
                <select id="defaultSurrogate">
                    <option value="council">Council (GP + Polynomial)</option>
                    <option value="gaussian_process">Gaussian Process (RBF)</option>
                    <option value="polynomial">Piecewise Polynomial</option>
                </select>
            </div>
            <div class="form-group">
                <label for="defaultAcquisition">Default Acquisition Optimizer</label>
                <select id="defaultAcquisition">
                    <option value="lbfgs">L-BFGS (Log-EI)</option>
                    <option value="perihelion">Perihelion (Halley Log-EI)</option>
                    <option value="random">Random Search (Log-EI)</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="defaultWarmupTrials">Default Warmup Trials</label>
                    <input type="number" id="defaultWarmupTrials" min="1" max="50" value="5">
                </div>
                <div class="form-group">
                    <label for="defaultLengthScale">Default RBF Length Scale</label>
                    <input type="number" id="defaultLengthScale" min="0.01" max="5" step="0.05" value="0.3">
                </div>
            </div>
            <button class="btn btn-primary" id="saveSettingsButton">Save Settings</button>
        </div>
        <div class="settings-panel wasm-info-panel">
            <h3>WebAssembly Build Command</h3>
            <p class="muted-note">Optimization runs strictly in the compiled C++ WebAssembly engine (<code>optima.js</code> + <code>optima.wasm</code>). Once Emscripten is installed, run:</p>
            <pre class="code-snippet">./webui/build_wasm.sh</pre>
        </div>
    </main>
    <footer>
        Experiment Optimizer &mdash; Ask &amp; Tell Interface
    </footer>
    <script>
        (function() {
            const STORAGE_KEY_SETTINGS = 'settings';
            const DEFAULTS = {
                defaultDirection: 'minimize',
                defaultSurrogate: 'council',
                defaultAcquisition: 'lbfgs',
                defaultWarmupTrials: 5,
                defaultLengthScale: 0.3
            };
            function loadSettingsFromStorage() {
                const raw = localStorage.getItem(STORAGE_KEY_SETTINGS);
                if (!raw) return Object.assign({}, DEFAULTS);
                try {
                    return Object.assign({}, DEFAULTS, JSON.parse(raw));
                } catch (e) {
                    return Object.assign({}, DEFAULTS);
                }
            }
            function saveSettingsToStorage(settings) {
                localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
            }
            function loadSettingsIntoForm() {
                const settings = loadSettingsFromStorage();
                document.getElementById('defaultDirection').value = settings.defaultDirection;
                document.getElementById('defaultSurrogate').value = settings.defaultSurrogate;
                document.getElementById('defaultAcquisition').value = settings.defaultAcquisition;
                document.getElementById('defaultWarmupTrials').value = settings.defaultWarmupTrials;
                document.getElementById('defaultLengthScale').value = settings.defaultLengthScale;
            }
            function saveSettings() {
                const settings = loadSettingsFromStorage();
                settings.defaultDirection = document.getElementById('defaultDirection').value;
                settings.defaultSurrogate = document.getElementById('defaultSurrogate').value;
                settings.defaultAcquisition = document.getElementById('defaultAcquisition').value;
                settings.defaultWarmupTrials = Math.max(1, parseInt(document.getElementById('defaultWarmupTrials').value, 10) || 5);
                settings.defaultLengthScale = Math.max(0.01, parseFloat(document.getElementById('defaultLengthScale').value) || 0.3);
                saveSettingsToStorage(settings);
                alert('Settings saved.');
            }
            document.addEventListener('DOMContentLoaded', function() {
                loadSettingsIntoForm();
                document.getElementById('saveSettingsButton').addEventListener('click', function(e) {
                    e.preventDefault();
                    saveSettings();
                });
            });
        })();
    </script>
</body>
</html>
